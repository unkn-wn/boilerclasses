name: Deploy

on:
  push:
    branches:
      - main
  # pushes made with GITHUB_TOKEN (the data pipeline's snapshot commits) don't trigger push
  workflow_run:
    workflows: ["Data Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if this commit is already running'
        type: boolean
        default: false

# one deploy at a time; a newer one waits instead of cancelling a swap halfway through
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy app
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 30
    # the self-hosted runner on the BoilerClasses VM
    runs-on: [self-hosted, boilerclasses]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Build and swap
        env:
          FORCE: ${{ inputs.force }}
        run: |
          sha=$(git rev-parse --short HEAD)
          image="boilerclasses:$sha"
          previous=$(docker inspect --format '{{.Config.Image}}' boilerclasses 2>/dev/null || true)
          if [ "$previous" = "$image" ] && [ "$FORCE" != "true" ]; then
            echo "$sha is already running"
            exit 0
          fi

          # the old container keeps serving until the build succeeds
          docker build -t "$image" .

          run() {
            docker rm -f boilerclasses > /dev/null 2>&1 || true
            docker run -d --name boilerclasses --restart unless-stopped -p 80:3000 "$1" > /dev/null
          }
          # the site comes up once push.py has loaded the snapshot into redis
          healthy() {
            for _ in $(seq 1 36); do
              code=$(curl -s -m 5 -o /dev/null -w "%{http_code}" -H "Host: boilerclasses.com" "http://localhost/api/search?maxlim=1" || true)
              [ "$code" = "200" ] && return 0
              sleep 5
            done
            return 1
          }

          run "$image"
          if healthy; then
            echo "Deployed $sha"
            docker image prune -f > /dev/null
            exit 0
          fi

          echo "::error::$image failed its health check, rolling back to ${previous:-nothing}"
          docker logs --tail 40 boilerclasses || true
          if [ -n "$previous" ]; then
            run "$previous"
            healthy && echo "Rolled back to $previous"
          fi
          exit 1
